name: Autopolis CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render worker tests
        run: |
          pip install -r render-worker/requirements-dev.txt
          PYTHONPATH=render-worker pytest -q render-worker/tests
      - name: Full repository lint (known baseline debt)
        run: npm run lint
        continue-on-error: true
      - name: Lint changed JS/TS files (required)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.js' '*.jsx' '*.ts' '*.tsx' | grep -vE '(^|/)(dist|build|coverage|node_modules)/' || true)"
          if [ -z "$files" ]; then
            echo "No changed JS/TS files to lint."
            exit 0
          fi
          printf '%s\n' "$files" | xargs -r npx eslint
      - name: Production build
        run: npm run build
