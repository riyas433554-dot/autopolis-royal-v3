name: Autopolis CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render worker tests
        run: |
          pip install -r render-worker/requirements-dev.txt
          PYTHONPATH=render-worker pytest -q render-worker/tests
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
