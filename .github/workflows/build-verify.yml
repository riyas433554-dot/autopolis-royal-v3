name: Autopolis Build Verify
on:
  push:
    branches: [feature/ecc-city-ecosystem-workflow]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check server JavaScript syntax
        run: for file in api/*.js server.js; do node --check "$file"; done
      - run: npm run build
